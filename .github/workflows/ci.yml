name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # This repository has pull requests turned off on Forgejo, so a branch is
  # checked by dispatching CI on it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and bundle export
    # Deliberately NOT pinned to an OS: both self-hosted ARM64 runners (the
    # Linux container and the macOS box) can run these Node-only steps, and a
    # job asking for a label no ONLINE runner offers queues forever rather
    # than failing loudly.
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # An Expo tree is ~50k files and a self-hosted runner's default
        # descriptor limit is 256 — npm ci dies partway with ENFILE otherwise.
        run: |
          ulimit -n 8192 || true
          npm ci

      - name: Typecheck
        run: npm run typecheck

      # The closest thing to "does the app actually load" without a device: a
      # real Metro production build resolves every import and every route, so
      # a broken module path or a bad expo-router file cannot reach a build.
      # --source-maps makes the Sentry Metro serializer stamp a debug id into
      # each bundle and its map, which is what ErrorTrack matches a stack to.
      - name: Export iOS and Android bundles
        run: |
          npx expo export --platform ios --output-dir dist/ios --source-maps
          npx expo export --platform android --output-dir dist/android --source-maps
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_ERRORTRACK_DSN: ${{ secrets.ERRORTRACK_DSN }}

      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls dist/ios/_expo/static/js/*/* dist/android/_expo/static/js/*/* | grep -v '\.map$' | xargs du -sh >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Proves the upload path end to end on every run that has the secrets.
      # Without them (forks, a fresh clone) the step says so and passes: the
      # app itself sends nothing when no DSN is configured.
      - name: Upload source maps to ErrorTrack
        env:
          SENTRY_URL: ${{ secrets.ERRORTRACK_URL }}
          SENTRY_ORG: ${{ secrets.ERRORTRACK_ORG }}
          SENTRY_PROJECT: ${{ secrets.ERRORTRACK_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.ERRORTRACK_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_URL" ]; then
            echo "ErrorTrack secrets not set; skipping source map upload."
            exit 0
          fi
          npx sentry-expo-upload-sourcemaps dist
          echo "### Source maps" >> "$GITHUB_STEP_SUMMARY"
          for m in dist/*/_expo/static/js/*/*.map; do
            node -e 'const m=require(process.argv[1]);console.log("- "+require("path").basename(process.argv[1])+" debug id "+m.debugId)' "$PWD/$m" >> "$GITHUB_STEP_SUMMARY"
          done
